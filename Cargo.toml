[package]
name = "nucleo_fluxo_tts"
version = "0.1.0"
edition = "2021"
description = "Primitivas nativas de fluxo e replay de audio TTS"
publish = false

[lib]
name = "nucleo_fluxo_tts"
path = "src/lib.rs"

[dependencies]

[workspace]
resolver = "2"
members = [".", "vinculo_python", "crates/*"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
