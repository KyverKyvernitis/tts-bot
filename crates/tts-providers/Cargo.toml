[package]
name = "tts-providers"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
regex = "1"
fancy-regex = "0.16"
uuid = { version = "1", features = ["v4"] }
httpdate = "1"
url = "2"

[dev-dependencies]
