[package]
name = "tts-engines"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
hound = "3.5"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "tts-worldline-native"
path = "src/bin/worldline_native.rs"
