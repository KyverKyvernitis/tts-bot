[package]
name = "tts-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Private Unix HTTP service for native TTS providers and rendering"

[dependencies]
tts-providers = { path = "../tts-providers" }
tts-policy = { path = "../tts-policy" }
tts-render = { path = "../tts-render" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
